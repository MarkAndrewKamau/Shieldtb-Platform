services:
  api:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - .:/app:Z
    ports:
      - "8000:8000"
    env_file:
      - path: .env.example
      - path: .env
        required: false
    depends_on:
      - db

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: shieldtb
      POSTGRES_USER: shieldtb
      POSTGRES_PASSWORD: shieldtb
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
