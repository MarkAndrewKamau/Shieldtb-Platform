name: CI

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"
  pull_request:
    branches:
      - main
      - develop

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: shieldtb
          POSTGRES_USER: shieldtb
          POSTGRES_PASSWORD: shieldtb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shieldtb -d shieldtb"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    env:
      DATABASE_URL: postgres://shieldtb:shieldtb@localhost:5432/shieldtb
      DJANGO_SECRET_KEY: ci-only-secret-key
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      JWT_SIGNING_KEY: ci-only-jwt-signing-key-with-at-least-32-chars
      JWT_ALGORITHM: HS256
      JWT_ISSUER: shieldtb-auth
      JWT_AUDIENCE: shieldtb-api
      JWT_COOKIE_SECURE: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"

      - name: Lint
        run: ruff check --no-cache .

      - name: Django checks
        run: python manage.py check

      - name: Check migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Apply migrations
        run: python manage.py migrate --noinput

      - name: Test
        run: pytest
